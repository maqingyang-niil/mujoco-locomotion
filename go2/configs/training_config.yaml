



environment:
  xml_path: "../mujoco_menagerie/unitree/scene.xml"
  decimation: 10
  action_scale: 0.40

  kp: 55.0
  kd: 1.4

  max_episode_steps: 1000 # 50hz的情况下20s
  min_base_height: 0.12
  max_pitch_roll: 0.8
  reset_noise_scale: 0.1

  lin_vel_sigma: 0.20
  ang_vel_sigma: 0.25
  randomize_dynamics: true
  push_enable: true
  push_interval_s: [3.0,7.0]
  push_duration_s: 0.15
  push_force: [-40.0,40.0]
  obs_noise_scale: 0.0

commands:
  gaits: ["trot"]
  stand_probability: 0.10
  max_speed_per_hz: 0.40
  max_speed: 1.0
  feasibility_margin: 0.85
  resample_interval_s: 5.0

  initial:
    lin_vel_x: [-0.5,0.85]
    lin_vel_y: [-0.3,0.3]
    ang_vel_yaw: [-0.8,0.8]

    gait_frequency: [1.8,3.0]
    base_height: [0.29,0.31]

  final:
    lin_vel_x: [-0.70,0.85]
    lin_vel_y: [-0.40,0.40]
    ang_vel_yaw: [-1.5,1.5]
    gait_frequency: [1.5,3.0]
    base_height: [0.27,0.34]

curriculum:
  enable: true
  threshold: 0.85
  decay_threshold: 0.55
  step: 0.05

reward:
  weights:
    tracking_lin_vel_xy: 1.5
    tracking_ang_vel_xy: 0.75
    gait_phase: 1.5
    foot_air_time: 1.0
    foot_height: -30.0
    lin_vel_z: -2.0
    ang_vel_xy: -0.05
    orientation: -1.0
    base_height: -5.0
    torques: -0.0002
    joint_acceleration: -0.00000025
    action_rate: -0.01
    joint_limit: -10.0
    collision: -1.0
    foot_slip: -0.05
    stand_still: -0.5
    alive: 0.25

training:
  algorithm: "PPO"
  total_timesteps: 50_000_000
  n_envs: 16
  seed: 0
  learning_rate: 0.0003
  lr_schedule: "linear"
  n_steps: 512
  batch_size: 2048
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.002
  vf_coef: 0.5
  max_grad_norm: 1.0
  target_kl: 0.02
  policy: "MlpPolicy"
  policy_kwargs:
    net_arch: [512,256,128]
    log_std_init: -1.0

logging:
  log_dir: "../logs/"
  model_dir: "../models/"
  save_freq: 500000
  eval_freq: 200000
  n_eval_episodes: 10
  tensorboard_log: "../logs/tensorboard/"


    




